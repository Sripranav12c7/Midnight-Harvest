std = "roblox"
allow_defined_top = true

[lint]
unused_variable = "warn"
unused_local = "warn"
unused_function = "warn"
global_variable = "error"
unused_import = "warn"
unused_type = "warn"
unused_enum = "warn"
unused_loop_iteration = "warn"
incorrect_standard_library_use = "error"
deprecated_standard_library_use = "warn"
duplicate_keys_in_table = "error"
unreachable_code = "warn"
shadowing = "warn"
empty_if = "warn"
divide_by_zero = "warn"
missing_return = "warn"
unbalanced_assignments = "warn"
multiple_statements = "warn"
redundant_local = "warn"
if_same_then_else = "warn"
if_same_elseif = "warn"
roblox_incorrect_color3_new_arguments = "error"
roblox_incorrect_roact_use = "warn"
roblox_incorrect_instance_new_arguments = "error"